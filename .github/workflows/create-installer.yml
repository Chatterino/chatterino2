name: Create installer

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    # make sure this only runs on the default branch
    branches:
      - master
      - "bugfix-release/*"
      - "release/*"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  create-installer:
    runs-on: windows-latest
    # Only run manually or when a build succeeds
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        qt-version: ["6.8.3"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # allows for tags access
          persist-credentials: false

      - name: Resolve Build workflow run
        id: resolve-build-run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            if (context.eventName === "workflow_run") {
              return String(context.payload.workflow_run.id);
            }

            const { owner, repo } = context.repo;

            // Manual runs do not have a triggering workflow_run payload.
            // Match the previous commit-based artifact lookup behavior.
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "build.yml",
              head_sha: context.sha,
              status: "success",
              per_page: 1,
            });

            const run = response.data.workflow_runs[0];

            if (!run) {
              core.setFailed(`No successful Build workflow run found for commit ${context.sha}.`);
              return "";
            }

            return String(run.id);

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chatterino-windows-x86-64-Qt-${{ matrix.qt-version }}.zip
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve-build-run.outputs.result }}
          path: build/

      - name: Unzip
        run: 7z e -spf chatterino-windows-x86-64-Qt-${{ matrix.qt-version }}.zip
        working-directory: build

      - name: Install InnoSetup
        run: choco install innosetup

      - name: Add InnoSetup to path
        run: echo "C:\Program Files (x86)\Inno Setup 6\" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Enable Developer Command Prompt
        uses: Chatterino/msvc-dev-cmd@24444121cb2805a7adbd23d0f4455d0916af896b # v2.0.7

      - name: Build installer
        id: build-installer
        working-directory: build
        run: ..\.CI\build-installer.ps1
        shell: powershell

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: build/${{ steps.build-installer.outputs.C2_INSTALLER_BASE_NAME }}.exe
          name: ${{ steps.build-installer.outputs.C2_INSTALLER_BASE_NAME }}.exe
